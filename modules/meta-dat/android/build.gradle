plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.metadat'
version = '1.0.1'

android {
  namespace 'expo.modules.metadat'
  defaultConfig {
    versionCode 1
    versionName '1.0.1'
  }
}

dependencies {
  // Meta Wearables DAT 1.0.1 (Maven Central, com.meta.wearable).
  implementation 'com.meta.wearable:mwdat-core:1.0.1'
  implementation 'com.meta.wearable:mwdat-camera:1.0.1'
  implementation 'com.meta.wearable:mwdat-display:1.0.1'
  implementation 'com.meta.wearable:mwdat-inputs:1.0.1'
  implementation 'com.meta.wearable:mwdat-motion:1.0.1'
  implementation 'com.meta.wearable:mwdat-mockdevice:1.0.1'
  implementation 'com.meta.wearable:mwdat-speech:1.0.1'
}
